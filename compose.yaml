name: csc3104

services:

  cloud-fastapi:
    image: cloud-fastapi:latest
    build: .
    ports:
      - "8000:8000"
    environment:
      REDIS_URL: redis://cloud-redis:6379/0
      AWS_ENDPOINT_URL: http://cloud-localstack:4566
      AWS_ACCESS_KEY_ID: csc3104
      AWS_SECRET_ACCESS_KEY: csc3104
      AWS_DEFAULT_REGION: ap_southeast-1
    depends_on:
      cloud-redis:
        condition: service_healthy
      cloud-localstack:
        condition: service_healthy

  cloud-redis:
    image: redis:latest
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - cloud-redis-data:/data
    command: ["redis-server", "--appendonly", "yes"]

  cloud-localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: s3,sqs
      AWS_DEFAULT_REGION: ap_southeast-1
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set LOCALSTACK_AUTH_TOKEN in .env}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://cloud-localstack:4566/_localstack/health"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  cloud-redis-data:
