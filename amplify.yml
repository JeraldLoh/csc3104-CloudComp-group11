# AWS Amplify Hosting build settings for the traveller app (issue 2.1).
# The repo holds several apps, so Amplify is told which folder to build (appRoot).
version: 1
applications:
  - appRoot: apps/traveller
    frontend:
      phases:
        preBuild:
          commands:
            # Vite 8 needs Node 20.19+; use Node 22 like local development.
            - nvm install 22
            - nvm use 22
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
