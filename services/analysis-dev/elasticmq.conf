# Local stand-in for SQS (ElasticMQ). Same settings as contracts/queues.md:
# visibility timeout 30 s, dead-letter queue after 5 failed attempts.
include classpath("application.conf")

node-address {
  protocol = http
  host = "*"          # queue URLs use whatever host the caller used (e.g. elasticmq)
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

queues {
  careroute-checkins {
    defaultVisibilityTimeout = 30 seconds
    deadLettersQueue {
      name = "careroute-checkins-dlq"
      maxReceiveCount = 5
    }
  }
  careroute-checkins-dlq {}
}
