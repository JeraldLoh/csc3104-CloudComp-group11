# Runs the Check-in Service locally with its own Redis and LocalStack (emulated
# DynamoDB + SQS). Self-contained, because the shared compose.yaml was removed from the
# repo (the team now uses kind for local Kubernetes: see the root README).
#
# From the repo root, once per PowerShell window:
#   $env:COMPOSE_FILE = "services/checkin-service/compose.checkin.yaml"
# then:
#   docker compose up -d --build        start (or rebuild after code changes)
#   docker compose stop checkin-service stop just the service (e.g. to test retries)
#   docker compose down                 stop everything
#
# Needs LOCALSTACK_AUTH_TOKEN in the .env file at the repo root (never commit it).
# Paths below are relative to this file's folder.
name: careroute-checkin

services:
  checkin-service:
    image: checkin-service:local
    build: .
    ports:
      - "8001:8000"
    environment:
      REDIS_URL: redis://cloud-redis:6379/0
      AWS_ENDPOINT_URL: http://cloud-localstack:4566
      AWS_ACCESS_KEY_ID: csc3104
      AWS_SECRET_ACCESS_KEY: csc3104
      AWS_DEFAULT_REGION: ap-southeast-1
      CREATE_RESOURCES: "true"
    depends_on:
      cloud-redis:
        condition: service_healthy
      cloud-localstack:
        condition: service_healthy

  cloud-redis:
    image: redis:7
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  cloud-localstack:
    image: localstack/localstack:latest
    ports:
      - "127.0.0.1:4566:4566"
    environment:
      SERVICES: sqs,dynamodb
      AWS_DEFAULT_REGION: ap-southeast-1
    env_file: ../../.env            # LOCALSTACK_AUTH_TOKEN
    healthcheck:
      # Newer LocalStack images don't include curl, so check with Python.
      test: python3 -c "import urllib.request as u; u.urlopen('http://localhost:4566/_localstack/health', timeout=2)"
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 30s
