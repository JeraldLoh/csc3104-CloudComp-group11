# Response headers for the traveller app on Amplify Hosting.
applications:
  - appRoot: apps/traveller
    customHeaders:
      # The service worker and the page must never be cached by the browser or CDN,
      # or phones would keep running an old version of the app indefinitely.
      - pattern: '/sw.js'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      - pattern: '/index.html'
        headers:
          - key: 'Cache-Control'
            value: 'no-cache'
      # Built files have a content hash in their names, so they can be cached for a year.
      - pattern: '/assets/*'
        headers:
          - key: 'Cache-Control'
            value: 'public, max-age=31536000, immutable'
      - pattern: '**/*'
        headers:
          - key: 'X-Content-Type-Options'
            value: 'nosniff'
          - key: 'Referrer-Policy'
            value: 'no-referrer'
