AWSTemplateFormatVersion: "2010-09-09"
Description: >
  IAM role that the GitHub Actions workflow .github/workflows/services.yml
  assumes through GitHub's OIDC provider (no long-lived access keys) to push
  images to ECR and deploy services onto the CareRoute EKS cluster.
  Deploy once per AWS account. It is separate from the platform stack, so
  teardown leaves it in place, and it costs nothing while idle.
  Deploy with CAPABILITY_NAMED_IAM acknowledged.

Parameters:
  GitHubRepository:
    Type: String
    Default: JeraldLoh/csc3104-CloudComp-group11
    Description: owner/repo allowed to assume the role.
  GitHubBranch:
    Type: String
    Default: main
    Description: Only workflow runs on this branch can assume the role (pull requests cannot).
  CreateOidcProvider:
    Type: String
    Default: "true"
    AllowedValues: ["true", "false"]
    Description: >
      An account can only have one token.actions.githubusercontent.com provider.
      Set to false if it already exists (IAM > Identity providers).
  RoleName:
    Type: String
    Default: careroute-github-deploy
  ResourcePrefix:
    Type: String
    Default: careroute
    Description: The role may only touch ECR repositories and EKS clusters whose names start with this prefix.
  AppNamespace:
    Type: String
    Default: careroute
    Description: The only Kubernetes namespace the role may grant itself access to.

Conditions:
  MakeOidcProvider: !Equals [!Ref CreateOidcProvider, "true"]

Resources:
  GitHubOidcProvider:
    Type: AWS::IAM::OIDCProvider
    Condition: MakeOidcProvider
    Properties:
      Url: https://token.actions.githubusercontent.com
      ClientIdList: [sts.amazonaws.com]

  DeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Ref RoleName
      MaxSessionDuration: 3600
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Federated: !If
                - MakeOidcProvider
                - !Ref GitHubOidcProvider
                - !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:oidc-provider/token.actions.githubusercontent.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                token.actions.githubusercontent.com:aud: sts.amazonaws.com
                token.actions.githubusercontent.com:sub: !Sub repo:${GitHubRepository}:ref:refs/heads/${GitHubBranch}
      Policies:
        - PolicyName: deploy-services
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              # Stack status and outputs (Redis, queues, cluster name, per-service role ARNs)
              - Effect: Allow
                Action: cloudformation:DescribeStacks
                Resource: "*"
              - Effect: Allow
                Action: ecr:GetAuthorizationToken
                Resource: "*"
              # Teardown deletes the careroute-* repositories, so the workflow recreates them
              - Effect: Allow
                Action:
                  - ecr:CreateRepository
                  - ecr:DescribeRepositories
                  - ecr:BatchCheckLayerAvailability
                  - ecr:BatchGetImage
                  - ecr:GetDownloadUrlForLayer
                  - ecr:InitiateLayerUpload
                  - ecr:UploadLayerPart
                  - ecr:CompleteLayerUpload
                  - ecr:PutImage
                Resource: !Sub arn:${AWS::Partition}:ecr:${AWS::Region}:${AWS::AccountId}:repository/${ResourcePrefix}-*
              - Effect: Allow
                Action: eks:DescribeCluster
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ResourcePrefix}-*
              # Teardown deletes the cluster and its access entries, so the workflow adds its own on
              # each new cluster. It may only add itself, and only with namespace-scoped edit rights.
              - Effect: Allow
                Action: eks:CreateAccessEntry
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:cluster/${ResourcePrefix}-*
                Condition:
                  ArnEquals:
                    eks:principalArn: !Sub arn:${AWS::Partition}:iam::${AWS::AccountId}:role/${RoleName}
              # Access entry ARNs end in <cluster>/role/<account>/<role name>/<uuid>: this role's own entry only
              - Effect: Allow
                Action: eks:DescribeAccessEntry
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:access-entry/${ResourcePrefix}-*/role/${AWS::AccountId}/${RoleName}/*
              - Effect: Allow
                Action: eks:AssociateAccessPolicy
                Resource: !Sub arn:${AWS::Partition}:eks:${AWS::Region}:${AWS::AccountId}:access-entry/${ResourcePrefix}-*/role/${AWS::AccountId}/${RoleName}/*
                Condition:
                  StringEquals:
                    eks:policyArn: !Sub arn:${AWS::Partition}:eks::aws:cluster-access-policy/AmazonEKSEditPolicy
                    eks:accessScope: namespace
                  ForAllValues:StringEquals:
                    eks:namespaces: !Ref AppNamespace

Outputs:
  DeployRoleArn:
    Description: Set this as the repository variable AWS_DEPLOY_ROLE_ARN.
    Value: !GetAtt DeployRole.Arn
