# Deployment, Service and HPA all become careroute-detector-route-corridor
resources:
  - ../base
nameSuffix: -route-corridor
labels:
  - pairs: { app: careroute-detector-route-corridor }
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DETECTOR_ID, value: route-corridor }
