apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector
spec:
  replicas: 2
  selector:
    matchLabels: { app: detector }
  template:
    metadata:
      labels:
        app: detector
        app.kubernetes.io/component: detector   # shared by all detectors, used for spreading
    spec:
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                topologyKey: kubernetes.io/hostname
                labelSelector:
                  matchLabels: { app.kubernetes.io/component: detector }
            - weight: 50
              podAffinityTerm:
                topologyKey: topology.kubernetes.io/zone
                labelSelector:
                  matchLabels: { app.kubernetes.io/component: detector }
      containers:
        - name: detector
          image: cloud-detectors:local
          imagePullPolicy: IfNotPresent   # important for kind - don't try to pull from a registry
          ports: [{ containerPort: 8000 }]
          env:
            - name: REDIS_URL
              value: "redis://cloud-redis:6379/0"
            # DETECTOR_ID is added by each detector's kustomization
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: detector
spec:
  type: ClusterIP
  selector: { app: detector }
  ports: [{ port: 8000, targetPort: 8000 }]
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: detector
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: detector }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
