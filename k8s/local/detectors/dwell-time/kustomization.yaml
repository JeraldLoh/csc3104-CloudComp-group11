# Deployment, Service and HPA all become detector-dwell
resources:
  - ../base
nameSuffix: -dwell
labels:
  - pairs: { app: detector-dwell }
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DETECTOR_ID, value: dwell-time }
