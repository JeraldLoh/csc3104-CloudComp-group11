# Deployment, Service and HPA all become detector-heading
resources:
  - ../base
nameSuffix: -heading
labels:
  - pairs: { app: detector-heading }
    includeSelectors: true
    includeTemplates: true
patches:
  - target: { kind: Deployment }
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env/-
        value: { name: DETECTOR_ID, value: heading-speed }
