# Check-in analysis (Member 3) on the local kind cluster: the Coordinator (asks the detectors, decides,
# reports problems to the Alert Service, serves the dashboard).
# Not in k8s/local/kustomization.yaml, so teammates without the image aren't affected. To run it:
#   docker build -t coordinator:local services/coordinator
#   kind load docker-image coordinator:local --name csc3104-local
#   kubectl apply -k k8s/local/analysis
# Needs k8s/local (Redis, LocalStack, Check-in and Alert Services) and k8s/local/detectors first.
resources:
  - coordinator.yaml
