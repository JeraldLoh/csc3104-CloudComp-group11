# No top-level `namespace:` here: it would also rewrite aws-logging.yaml's
# aws-observability resources. Each manifest sets its own namespace instead.
resources:
  - namespace.yaml
  - serviceaccount.yaml
  - aws-logging.yaml
  - fastapi.yaml
  - ingress.yaml
images:
  - name: cloud-fastapi
    # TODO: EcrRepositoryUri output from the stack, and the tag you pushed
    newName: <ACCOUNT_ID>.dkr.ecr.ap-southeast-1.amazonaws.com/cloud-fastapi
    newTag: v1
