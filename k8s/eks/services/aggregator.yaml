# Aggregator (Member 3): POST /internal/votes, called by the Coordinator.
# Deploy: bash scripts/macos/deploy.sh --service aggregator   (fills the __PLACEHOLDERS__)
# Dashboard (not exposed to the internet):
#   kubectl -n careroute port-forward svc/aggregator 8001:8000   then open http://localhost:8001/dashboard
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aggregator
  namespace: __NAMESPACE__
  labels: { app: aggregator }
spec:
  replicas: 2                       # the HPA takes over from here
  selector:
    matchLabels: { app: aggregator }
  template:
    metadata:
      labels: { app: aggregator }
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: aggregator }
      containers:
        - name: aggregator
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://__REDIS_ENDPOINT__:6379/0" }
            - { name: ALERT_SERVICE_URL, value: "http://alert-service:8000" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: aggregator                  # the Coordinator's default AGGREGATOR_URL
  namespace: __NAMESPACE__
spec:
  selector: { app: aggregator }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Needs metrics-server in the cluster, like the detectors' HPAs.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aggregator
  namespace: __NAMESPACE__
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: aggregator }
  minReplicas: 2
  maxReplicas: 4
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 60 }
---
# Keep at least one replica running during voluntary disruptions (e.g. Fargate patching).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: aggregator
  namespace: __NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: aggregator }
