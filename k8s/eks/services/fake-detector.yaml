# Fake detectors (stand-ins for Member 4's), one image deployed four times under the
# contract's service names, so the Coordinator finds them without extra config.
# Deploy: bash scripts/macos/deploy.sh --service fake-detector  (Deployments found by their part-of label)
# Remove before Member 4 deploys the real detectors (same names):
#   kubectl delete -n careroute deploy,svc -l role=fake-detector
# Change one live: kubectl -n careroute port-forward svc/detector-route 9001:8000, then
#   curl -X POST localhost:9001/control -H 'Content-Type: application/json' -d '{"mode":"wrong"}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-route
  namespace: __NAMESPACE__
  labels: { app: detector-route, role: fake-detector, app.kubernetes.io/part-of: fake-detector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: detector-route }
  template:
    metadata:
      labels: { app: detector-route, role: fake-detector }
    spec:
      containers:
        - name: detector
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DETECTOR_ID, value: "route-corridor" }
            - { name: MODE, value: "auto" }
            - { name: PROBLEM_TYPE, value: "off_route" }
            - { name: CONFIDENCE, value: "0.8" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: detector-route
  namespace: __NAMESPACE__
  labels: { role: fake-detector }
spec:
  selector: { app: detector-route }
  ports: [{ port: 8000, targetPort: 8000 }]
---
