# Fake detectors (stand-ins for Member 4's), one image deployed under the contract's
# service names, so the Coordinator finds them without extra config.
# Deploy: bash scripts/macos/deploy.sh --service fake-detector  (Deployments found by their part-of label)
#
# Remove fakes as the real detectors arrive (same names), e.g. once Member 4 deploys
# route-corridor, heading-speed and dwell-time:
#   kubectl delete -n careroute deploy,svc -l 'fake-of in (route-corridor,heading-speed,dwell-time)'
# Remove all of them:  kubectl delete -n careroute deploy,svc -l role=fake-detector
#
# route-progress isn't deployed yet. Its fake abstains by default so a made-up vote never
# sways a real detector's decision. Switch it on live for a demo:
#   kubectl -n careroute port-forward svc/detector-progress 9004:8000, then
#   curl -X POST localhost:9004/control -H 'Content-Type: application/json' -d '{"mode":"auto"}'
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-route
  namespace: __NAMESPACE__
  labels: { app: detector-route, role: fake-detector, fake-of: route-corridor, app.kubernetes.io/part-of: fake-detector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: detector-route }
  template:
    metadata:
      labels: { app: detector-route, role: fake-detector }
    spec:
      containers:
        - name: detector
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: DETECTOR_ID, value: "route-corridor" }
            - { name: MODE, value: "auto" }
            - { name: PROBLEM_TYPE, value: "off_route" }
            - { name: CONFIDENCE, value: "0.8" }
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: detector-route
  namespace: __NAMESPACE__
  labels: { role: fake-detector, fake-of: route-corridor }
spec:
  selector: { app: detector-route }
  ports: [{ port: 8000, targetPort: 8000 }]
---
