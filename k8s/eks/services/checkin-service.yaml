# Check-in Service (Member 2, issue 2.3) on EKS Fargate.
# Deploy onto an existing stack with the team script, which builds the image, pushes it to
# ECR (careroute-checkin-service) and fills in the __PLACEHOLDERS__ (scripts/README.md):
#   Windows: .\scripts\windows\deploy.ps1 -Service checkin-service
#   Mac:     bash scripts/macos/deploy.sh --service checkin-service
# Uses the platform stack's careroute-checkins table (with pending-index) and queue.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: checkin-service
  namespace: __NAMESPACE__
  labels: { app: checkin-service }
spec:
  replicas: 2   # two, so the clean-up task's leader lease can be handed over if one dies
  selector:
    matchLabels: { app: checkin-service }
  template:
    metadata:
      labels: { app: checkin-service }
      annotations:   # lets a Prometheus server find the service's metrics
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: cloud-fastapi   # shared AWS permissions (careroute-* tables and queues), like the other services
      # Put the two replicas in different Availability Zones where possible, so losing
      # one zone doesn't take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: checkin-service }
      containers:
        - name: checkin-service
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://__REDIS_ENDPOINT__:6379/0" }
            - { name: AWS_DEFAULT_REGION, value: "__REGION__" }
            - { name: CHECKINS_TABLE, value: "careroute-checkins" }
            - { name: CHECKINS_QUEUE, value: "careroute-checkins" }
            - { name: CREATE_RESOURCES, value: "false" }   # the platform stack creates them
            # No AWS_ENDPOINT_URL and no access keys: boto3 uses real AWS + the IRSA role.
          # Fargate sizes the pod from requests (minimum 0.25 vCPU / 0.5 GB).
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          # Ready = Redis, DynamoDB and SQS reachable. Alive = process responds.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: checkin-service
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector: { app: checkin-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Keep at least one replica running during voluntary disruptions (e.g. Fargate patching).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: checkin-service
  namespace: __NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: checkin-service }
---
# Joins the team's single ALB (IngressGroup "careroute"). Rules run lowest group.order first;
# the catch-all "/" (k8s/eks/ingress.yaml) is 1000. The ALB's security group comes from that
# ingress, so it isn't repeated here.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: checkin-service
  namespace: __NAMESPACE__
  annotations:
    alb.ingress.kubernetes.io/group.name: careroute
    alb.ingress.kubernetes.io/group.order: "20"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip        # required for Fargate
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /ready
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/checkins       # also matches /api/checkins/batch
            pathType: Prefix
            backend:
              service:
                name: checkin-service
                port: { number: 8000 }
