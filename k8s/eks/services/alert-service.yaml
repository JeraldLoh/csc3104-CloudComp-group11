# Alert Service (Member 5) on EKS. Deployed with:
#   .\scripts\windows\deploy.ps1 -Service alert-service
# The script fills in the __PLACEHOLDERS__ from the platform stack (scripts/README.md).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alert-service
  namespace: __NAMESPACE__
  labels: { app: alert-service }
spec:
  replicas: 2   # an alert must not be lost if one replica crashes
  selector:
    matchLabels: { app: alert-service }
  template:
    metadata:
      labels: { app: alert-service }
    spec:
      serviceAccountName: cloud-fastapi   # shared AWS permissions (careroute-* tables and queues) for now
      # Put the replicas in different Availability Zones where possible, so losing a zone doesn't
      # take the service down.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: alert-service }
      volumes:
        - name: firebase
          secret: { secretName: firebase-service-account, optional: true }
      containers:
        - name: alert-service
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://__REDIS_ENDPOINT__:6379/0" }
            - { name: AWS_DEFAULT_REGION, value: "__REGION__" }
            - { name: DISRUPTIONS_QUEUE_URL, value: "__DISRUPTIONS_QUEUE_URL__" }
            - { name: CREATE_RESOURCES, value: "false" }   # the platform stack creates the tables and queue
            # "off" until Cognito (issue 1.5) exists, as for the Journey Service; then "cognito" + COGNITO_* settings.
            # Never "dev" here: it would let anyone claim to be any caregiver.
            - { name: AUTH_MODE, value: "off" }
            # Push notifications (issue 5.4): the Firebase key from the firebase-service-account Secret, made from
            # secrets/firebase-service-account.json (never in Git). Without the Secret the pod still starts, with push off.
            - { name: FIREBASE_CREDENTIALS, value: /secrets/firebase/service-account.json }
          volumeMounts:
            - { name: firebase, mountPath: /secrets/firebase, readOnly: true }
            # No AWS_ENDPOINT_URL and no keys: boto3 uses real AWS and the service account's role.
          # Fargate sizes the pod from requests (minimum 0.25 vCPU / 0.5 GB).
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: alert-service   # other services call http://alert-service:8000 (contracts/api.md)
  namespace: __NAMESPACE__
spec:
  selector: { app: alert-service }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Keep at least one replica running during voluntary disruptions (e.g. Fargate patching).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: alert-service
  namespace: __NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: alert-service }
---
# The caregiver and traveller apps' paths on the team's load balancer (one ALB for every service: IngressGroup
# "careroute", evaluated by group.order; the catch-all "/" in k8s/eks/ingress.yaml comes last). /internal/*,
# /health and /ready are not listed, so they stay private. /api/stream sends a ping every 15 s, inside the ALB's
# 60 s idle timeout.
# AUTH_MODE is "off" until Cognito (issue 1.5): anyone with the address can read travellers and their live
# locations. Use test travellers only on AWS, and tear the stack down after each session.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alert-service
  namespace: __NAMESPACE__
  annotations:
    alb.ingress.kubernetes.io/group.name: careroute
    alb.ingress.kubernetes.io/group.order: "40"
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip        # required for Fargate
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /ready
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /api/help           # traveller app
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/arrived        # traveller app
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/where-are-you  # traveller app's reply; the caregiver's ask is under /api/travellers
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/devices        # push sign-up, both apps
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/travellers     # caregiver app: profiles, live view, safe locations
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/incidents
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/stream         # caregiver app's live alerts (server-sent events)
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
          - path: /api/links
            pathType: Prefix
            backend:
              service:
                name: alert-service
                port: { number: 8000 }
