# Heartbeat Monitor (Member 1, issue 1.4) on EKS Fargate.
# Deploy onto an existing stack with the team script, which builds the image, pushes it to
# ECR (careroute-heartbeat-monitor) and fills in the __PLACEHOLDERS__ (scripts/README.md):
#   Windows: .\scripts\windows\deploy.ps1 -Service heartbeat-monitor
#   Mac:     bash scripts/macos/deploy.sh --service heartbeat-monitor
# Reads the Check-in Service's hb:* keys in Redis and calls the Alert Service; no AWS access needed.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: heartbeat-monitor
  namespace: __NAMESPACE__
  labels: { app: heartbeat-monitor }
spec:
  replicas: 2   # one checks the trips (leader lease); the other takes over if it dies
  selector:
    matchLabels: { app: heartbeat-monitor }
  template:
    metadata:
      labels: { app: heartbeat-monitor }
    spec:
      # Put the two replicas in different Availability Zones where possible, so losing
      # one zone doesn't stop silent travellers being noticed.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels: { app: heartbeat-monitor }
      containers:
        - name: heartbeat-monitor
          image: __IMAGE__
          ports: [{ containerPort: 8000 }]
          env:
            - { name: REDIS_URL, value: "redis://__REDIS_ENDPOINT__:6379/0" }
            - { name: ALERT_SERVICE_URL, value: "http://alert-service:8000" }
            # Thresholds (defaults in app/config.py): alert at phi 8, after a 30 s pause above ground,
            # +5 min underground, +15 min with the app in the background.
            - { name: PHI_THRESHOLD, value: "8" }
          # Fargate sizes the pod from requests (minimum 0.25 vCPU / 0.5 GB).
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { cpu: 250m, memory: 512Mi }
          # Ready = Redis reachable. Alive = process responds.
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: heartbeat-monitor
  namespace: __NAMESPACE__
spec:
  type: ClusterIP
  selector: { app: heartbeat-monitor }
  ports: [{ port: 8000, targetPort: 8000 }]
---
# Keep at least one replica running during voluntary disruptions (e.g. Fargate patching).
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: heartbeat-monitor
  namespace: __NAMESPACE__
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: heartbeat-monitor }
